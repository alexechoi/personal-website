name: Deploy

# Pushes to main deploy every project whose folder changed (and then `www`, so
# the homepage list stays current). Run it by hand to deploy specific projects.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      projects:
        description: "Space-separated project slugs, or 'all'"
        required: true
        default: all

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Does nothing until `make infra` has run and its outputs are saved as repo variables.
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      # For projects with a "build" step (e.g. a Vite app).
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy
        env:
          BEFORE: ${{ github.event.before }}
          PROJECTS: ${{ inputs.projects }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$PROJECTS" = all ]; then
              scripts/deploy.sh --all
            else
              # shellcheck disable=SC2086
              scripts/deploy.sh $PROJECTS
            fi
          else
            scripts/deploy.sh --changed "$BEFORE"
          fi
