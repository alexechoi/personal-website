server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Don't leak the project manifest.
    location = /project.json { return 404; }

    location / {
        # Serve the file, then a directory index, then fall back to index.html
        # so single-page apps with client-side routing work too.
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
